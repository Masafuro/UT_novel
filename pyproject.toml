[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ut_novel"
version = "0.1.0"
description = "An Undertale-style dialogue and background video generator."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "pydub>=0.25.1",
    "python-frontmatter>=1.0.0",
    "click>=8.1.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.1",
]

[project.scripts]
ut-novel = "ut_novel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
